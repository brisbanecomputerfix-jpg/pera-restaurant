<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Mirror-Polished Silver Gradients -->
    <linearGradient id="silverChrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="90%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="tineLeftGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="tineRightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="handleBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="goldAura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- 3D Shadow for Contrast -->
    <filter id="forkShadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FACC15" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#forkShadow)">
    <!-- 45-degree angle pointing precisely to top-left tip -->
    <g transform="translate(6, 6) rotate(-45) translate(0, -5)">
      
      <!-- ================= FORK HEAD ================= -->
      <!-- 4 Distinct Polished Silver Tines (Tapered tips at top) -->
      
      <!-- Outer Left Tine -->
      <path d="M -5.5 5 C -5.5 4.5 -4.8 4.5 -4.5 5 L -3.6 17 C -4.4 17.6 -5.2 17.6 -5.8 17 L -5.5 5 Z" 
            fill="url(#tineLeftGrad)" stroke="#1E293B" stroke-width="0.45"/>
      <path d="M -4.9 6 L -4.2 16" stroke="#FFFFFF" stroke-width="0.4" stroke-linecap="round" opacity="0.9"/>

      <!-- Inner Left Tine -->
      <path d="M -2 3.5 C -2 3 -1.3 3 -1 3.5 L -0.9 17.5 C -1.4 18 -1.9 18 -2.3 17.5 L -2 3.5 Z" 
            fill="url(#tineLeftGrad)" stroke="#1E293B" stroke-width="0.45"/>
      <path d="M -1.5 4.5 L -1.4 16.5" stroke="#FFFFFF" stroke-width="0.4" stroke-linecap="round" opacity="0.9"/>

      <!-- Inner Right Tine -->
      <path d="M 1 3.5 C 1 3 1.7 3 2 3.5 L 2.3 17.5 C 1.9 18 1.4 18 0.9 17.5 L 1 3.5 Z" 
            fill="url(#tineRightGrad)" stroke="#1E293B" stroke-width="0.45"/>
      <path d="M 1.5 4.5 L 1.6 16.5" stroke="#FFFFFF" stroke-width="0.4" stroke-linecap="round" opacity="0.9"/>

      <!-- Outer Right Tine -->
      <path d="M 4.5 5 C 4.8 4.5 5.5 4.5 5.5 5 L 5.8 17 C 5.2 17.6 4.4 17.6 3.6 17 L 4.5 5 Z" 
            fill="url(#tineRightGrad)" stroke="#1E293B" stroke-width="0.45"/>
      <path d="M 4.9 6 L 4.2 16" stroke="#FFFFFF" stroke-width="0.4" stroke-linecap="round" opacity="0.9"/>

      <!-- Fork Shoulder / U-shaped Cradle Base -->
      <path d="M -5.8 17 C -5.8 21.5 -3.2 24.5 -1.6 25.5 L 1.6 25.5 C 3.2 24.5 5.8 21.5 5.8 17 C 4.8 18.2 3.2 18.5 2.3 18.5 C 1.5 18.5 0.5 18 0 18 C -0.5 18 -1.5 18.5 -2.3 18.5 C -3.2 18.5 -4.8 18.2 -5.8 17 Z" 
            fill="url(#silverChrome)" stroke="#1E293B" stroke-width="0.5"/>

      <!-- ================= FORK NECK & HANDLE ================= -->
      <!-- Neck / Slender Waist -->
      <path d="M -1.6 25.5 L -1.2 31.5 L 1.2 31.5 L 1.6 25.5 Z" 
            fill="url(#handleBodyGrad)" stroke="#1E293B" stroke-width="0.45"/>

      <!-- Royal Collar Filigree Accent -->
      <rect x="-1.8" y="30.5" width="3.6" height="1.2" rx="0.4" 
            fill="url(#goldAura)" stroke="#0F172A" stroke-width="0.4"/>

      <!-- Classic Flared Palace Handle (Tapered Paddle Shape) -->
      <path d="M -1.2 31.5 C -1.2 36 -2.8 41 -3.5 45.5 C -4.2 50.5 -2.5 54 0 54 C 2.5 54 4.2 50.5 3.5 45.5 C 2.8 41 1.2 36 1.2 31.5 Z" 
            fill="url(#handleBodyGrad)" stroke="#1E293B" stroke-width="0.55"/>

      <!-- Embossed Handle Filigree & Specular Center Spine -->
      <path d="M 0 32.5 L 0 51.5" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round" opacity="0.95"/>
      <path d="M 0.5 33.5 L 0.5 50.5" stroke="#475569" stroke-width="0.35" stroke-linecap="round" opacity="0.5"/>
      <ellipse cx="0" cy="50" rx="1.8" ry="2.2" fill="none" stroke="#CBD5E1" stroke-width="0.4" opacity="0.7"/>

    </g>

    
    <!-- Interactive Golden Gleam Star at Pointer Tip -->
    <path d="M 2.5 -1.5 L 3.5 1.8 L 6.8 2.5 L 3.5 3.2 L 2.5 6.5 L 1.5 3.2 L -1.8 2.5 L 1.5 1.8 Z" fill="url(#goldAura)"/>
    <circle cx="2.5" cy="2.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="2.5" cy="2.5" r="3" stroke="#FEF08A" stroke-width="0.5" opacity="0.85"/>
    
  </g>
</svg>